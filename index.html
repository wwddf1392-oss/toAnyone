<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة لـ  اي شخص</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --text-main: #2f3542;
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .credits {
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            direction: ltr;
            z-index: 1000;
        }

        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            padding: 35px 25px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            display: none;
            box-sizing: border-box;
        }

        .card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #d63031;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        h2 {
            color: #e84393;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .redirect-notice {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
            transition: transform 0.2s;
            flex: 1;
        }

        button:hover {
            transform: scale(1.04);
        }

        button.secondary {
            background: linear-gradient(135deg, #a4b0be, #747d8c);
            box-shadow: 0 5px 15px rgba(116, 125, 140, 0.2);
        }

        .bear {
            font-size: 65px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .flower-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .falling-flower {
            position: absolute;
            top: -10%;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .popup-flower {
            font-size: 90px;
            margin: 15px 0;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="credits">تم البرمجة بواسطة الياس</div>

    <div class="flower-field" id="flowerContainer"></div>

    <div class="card-wrapper">
        <!-- الصفحة الأولى -->
        <div id="page1" class="card active">
            <div class="bear">🐻</div>
            <h1>هلو امي</h1>
            <p>تحبيني؟</p>
            <div class="btn-group">
                <button onclick="goToPage('page2')">اكيد</button>
                <button class="secondary" onclick="goToPage('page_no_1')">لا ما حبك</button>
            </div>
        </div>

        <!-- الصفحة الثانية -->
        <div id="page2" class="card">
            <div class="bear">🥰</div>
            <p> ادري تحبيني ولهل سبب اختاريتي هل زر اني هم احبج</p>
            <div class="btn-group">
                <button onclick="goToPage('page3')">اضغطي هنا</button>
            </div>
        </div>

        <!-- الصفحة الثالثة (الوردة + التوجيه ليوتيوب) -->
        <div id="page3" class="card">
            <div class="popup-flower">🌸</div>
            <h2>امي حبيبتي</h2>
            <p class="redirect-notice">انتضري بس 5 ثوانٍ... ✨</p>
        </div>

        <!-- صفحة لا ما حبك -->
        <div id="page_no_1" class="card">
            <div class="bear">🤔</div>
            <h2>متأكده؟</h2>
            <div class="btn-group">
                <button onclick="goToPage('page_sad')">اي</button>
                <button class="secondary" onclick="goToPage('page2')">لا</button>
            </div>
        </div>

        <!-- صفحة الوداع -->
        <div id="page_sad" class="card">
            <div class="bear">🥺</div>
            <p>عادي مو مشكله محد يحبني مو جديده مع السلامه</p>
            <div class="btn-group">
                <button onclick="closeSite()">مع السلامه</button>
            </div>
        </div>
    </div>

    <script>
        function goToPage(pageId) {
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('active');
            });

            document.getElementById(pageId).classList.add('active');

            if (pageId === 'page2' || pageId === 'page3') {
                startFlowers();
            } else {
                stopFlowers();
            }

            // عند الوصول لصفحة الوردة: الانتظار 5 ثوان ثم فتح الأغنية على يوتيوب
            if (pageId === 'page3') {
                setTimeout(() => {
                    // رابط أغنية رحمة رياض - تخيل هذا المنظر على يوتيوب
                    window.location.href = "https://youtu.be/J1fR4AIsLAI?si=XNKNx7R3w278zIQ1"; 
                }, 5000);
            }
        }

        let flowerInterval;
        function startFlowers() {
            const container = document.getElementById('flowerContainer');
            if (flowerInterval) return;

            const flowers = ['🌸', '🌹', '🌺', '🌷', '✨'];
            flowerInterval = setInterval(() => {
                const flower = document.createElement('div');
                flower.classList.add('falling-flower');
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.fontSize = (Math.random() * 15 + 20) + 'px';
                flower.style.animationDuration = (Math.random() * 2 + 3) + 's';
                container.appendChild(flower);

                setTimeout(() => { flower.remove(); }, 5000);
            }, 300);
        }

        function stopFlowers() {
            clearInterval(flowerInterval);
            flowerInterval = null;
            document.getElementById('flowerContainer').innerHTML = '';
        }

        function closeSite() {
            document.body.innerHTML = `
                <div style="text-align:center; color: #555; font-size: 22px; font-family: 'Tajawal', sans-serif;">
                    مع السلامة 👋
                </div>
            `;
        }
    </script>
</body>
</html>
